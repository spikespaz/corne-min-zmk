---
include:
  # Standard retail split: left half is central, holds keymap and ZMK Studio.
  - board: corne_min_left
    shield: rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: corne_min_left
  - board: corne_min_right
    shield: rgbled_adapter
    artifact-name: corne_min_right

  # Prospector dongle setup: dongle is central, both keyboard halves are peripherals.
  # The dongle hosts the keymap via the corne_min_dongle shield (mock kscan + transform).
  - board: seeeduino_xiao_ble
    shield: corne_min_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: corne_min_dongle
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: corne_min_dongle_settings_reset

  # Left half re-flashed as a peripheral for the prospector setup.
  # ZMK_SPLIT_ROLE_CENTRAL=n overrides the left board's default of central.
  - board: corne_min_left
    shield: rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_min_left_peripheral

  # Flash on either half to clear BT bonds and persisted settings.
  - board: corne_min_left
    shield: settings_reset
    artifact-name: corne_min_settings_reset
