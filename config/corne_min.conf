# Better BLE connection stability (experimental).
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Allow the central to fetch peripheral battery levels over BLE.
# No-op on peripherals: the symbol is undefined when ZMK_SPLIT_ROLE_CENTRAL=n.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Re-advertise peripheral battery levels as a GATT Battery Service so the OS sees them.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable ZMK Studio runtime configuration editing.
# No-op on peripherals: ZMK_STUDIO_RPC is only selected when ZMK_SPLIT_ROLE_CENTRAL=y.
CONFIG_ZMK_STUDIO=y
# Do not require &studio_unlock before edits are accepted.
# &studio_unlock is bound in the keymap (raise layer) so either half can lock/unlock.
CONFIG_ZMK_STUDIO_LOCKING=n

# Deep-sleep support; see ZMK_IDLE_SLEEP_TIMEOUT below.
# Disable in prospector_adapter.conf for the dongle.
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before idle: display off, BLE activity reduced.
# Default: 30000 (30 seconds), Current: 1 minute
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Milliseconds of idle before deep sleep (woken by any key press).
# Default: 900000 (15 minutes), Current: 4 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=240000
